# Declarative business rules for airline ontology analytics.
# Agents resolve ontology terms → flights columns via airline_graph.json,
# then apply these rules as SQL CASE/WHERE or post-query classification.
#
# Namespace: https://w3id.org/demo/airline#

ontology_namespace: "https://w3id.org/demo/airline#"

database: airlinedata

# ── SQL agent hints (read before generating JOINs) ───────────────────────────
sql_agent_hints:
  summary: >
    Flight.operatedBy joins flights.uniquecarrier to airlines.code.
    There is NO flights.carrier column. airlines has code + description only (no iata, no name).
    Flight.originAirport / destinationAirport join flights.origin|dest to airports.iata.
    airports has iata + airport only (no name column — airport maps to Airport.airportName).
  carrier_identifier_column: uniquecarrier
  carrier_identifier_property: uniqueCarrier
  airline_code_column: code
  airline_name_column: description
  airport_code_column: iata
  airport_name_column: airport
  do_not_use:
    - "flights.carrier — column does not exist; use uniquecarrier"
    - "airlines.iata — column does not exist on airlinedata.airlines; use code"
    - "airlines.name — column does not exist; use description"
    - "airports.name — column does not exist; use airport (Airport.airportName)"
  delay_note: >
    carrierdelay is delay MINUTES (CarrierDelayReason), not a carrier ID.
    Do not confuse with uniquecarrier.
  otp_note: >
    User "OTP" / "on-time performance" → ontology class OTP (equivalent OnTimePerformance).
    Use otp.sql.expr from business rules; threshold 15 min on BOTH arrdelay and depdelay; denominator cancelled = 0 only.
  kpi_catalog_note: >
    50 industry KPIs in kpi_catalog (from airline_kpi_catalog.yaml): D0, A0, SevereDelayRate,
    CarrierDelayShare, ASM proxy, ReliabilityCompositeScore, etc. Resolve user KPI terms to
    kpi_catalog.kpis.<ClassName>.sql.expr — never invent formulas when catalog entry exists.

# Ontology object property → physical JOIN (canonical for sql_executor)
object_property_joins:
  operatedBy:
    from_class: Flight
    from_table: flights
    from_column: uniquecarrier
    to_class: Airline
    to_table: airlines
    to_column: code
    airline_name_column: description
    join_sql: "JOIN {database}.airlines a ON f.uniquecarrier = a.code"
  assignedAircraft:
    from_class: Flight
    from_table: flights
    from_column: tailnum
    to_class: Plane
    to_table: planes
    to_column: tailnum
    join_sql: "JOIN {database}.planes p ON f.tailnum = p.tailnum"
  originAirport:
    from_class: Flight
    from_table: flights
    from_column: origin
    to_class: Airport
    to_table: airports
    to_column: iata
    airport_name_column: airport
    join_sql: "JOIN {database}.airports o ON f.origin = o.iata"
  destinationAirport:
    from_class: Flight
    from_table: flights
    from_column: dest
    to_class: Airport
    to_table: airports
    to_column: iata
    airport_name_column: airport
    join_sql: "JOIN {database}.airports d ON f.dest = d.iata"

# FAA / DOT thresholds (minutes)
thresholds:
  on_time_max_delay: 15
  minor_delay_max: 30
  moderate_delay_max: 60

# On-Time Performance (OTP) — ontology class OTP ≡ OnTimePerformance
# Agents: resolve user "OTP" → OTP / OnTimeFlight / thresholds.on_time_max_delay
otp:
  ontology_class: OTP
  equivalent_classes: [OnTimePerformance]
  alt_labels: [OTP, "on-time performance", on_time_performance]
  threshold_minutes: 15
  threshold_ref: on_time_max_delay
  definition: >
    OTP = percentage of completed flights (cancelled = 0) where arrDelay and depDelay
    are both <= 15 minutes (OnTimeFlight / FAA 15-minute rule).
  on_time_flight_rule_ref: flight_status_rules.OnTimeFlight
  sql:
    on_time_predicate: "cancelled = 0 AND COALESCE(arrdelay,0) <= 15 AND COALESCE(depdelay,0) <= 15"
    numerator: "SUM(CASE WHEN cancelled = 0 AND COALESCE(arrdelay,0) <= 15 AND COALESCE(depdelay,0) <= 15 THEN 1 ELSE 0 END)"
    denominator: "NULLIF(SUM(CASE WHEN cancelled = 0 THEN 1 ELSE 0 END), 0)"
    expr: "ROUND(100.0 * SUM(CASE WHEN cancelled = 0 AND COALESCE(arrdelay,0) <= 15 AND COALESCE(depdelay,0) <= 15 THEN 1 ELSE 0 END) / NULLIF(SUM(CASE WHEN cancelled = 0 THEN 1 ELSE 0 END), 0), 2)"
    alias: otp_pct
  default_having_min_completed: 1000

# Peak business hours on scheduled departure (crsDepTime, local airport HHMM integer)
time_windows:
  MorningPeak:
    class: MorningPeak
    crs_deptime_min: 600
    crs_deptime_max: 959
    label: "06:00–09:59"
  Midday:
    class: Midday
    crs_deptime_min: 1000
    crs_deptime_max: 1659
    label: "10:00–16:59"
  EveningPeak:
    class: EveningPeak
    crs_deptime_min: 1700
    crs_deptime_max: 2059
    label: "17:00–20:59"
  Overnight:
    class: Overnight
    crs_deptime_min: 2100
    crs_deptime_max: 559
    label: "21:00–05:59"
    wrap_midnight: true

# Flight status classification (maps to owl:OnTimeFlight, etc.)
flight_status_rules:
  - class: CancelledFlight
    when: "cancelled = 1"
  - class: DivertedFlight
    when: "diverted = '1' OR diverted = 'Y'"
  - class: OnTimeFlight
    when: "cancelled = 0 AND COALESCE(arrdelay,0) <= 15 AND COALESCE(depdelay,0) <= 15"
  - class: DelayedFlight
    when: "cancelled = 0 AND (COALESCE(arrdelay,0) > 15 OR COALESCE(depdelay,0) > 15)"

delay_severity_rules:
  - class: MinorDelay
    when: "GREATEST(COALESCE(arrdelay,0), COALESCE(depdelay,0)) BETWEEN 16 AND 30"
  - class: ModerateDelay
    when: "GREATEST(COALESCE(arrdelay,0), COALESCE(depdelay,0)) BETWEEN 31 AND 60"
  - class: SevereDelay
    when: "GREATEST(COALESCE(arrdelay,0), COALESCE(depdelay,0)) > 60"

# Primary delay reason = DOT cause with maximum attributed minutes (ties: priority order)
delay_reason_priority:
  - CarrierDelayReason
  - WeatherDelayReason
  - NASDelayReason
  - SecurityDelayReason
  - LateAircraftDelayReason

delay_reason_columns:
  CarrierDelayReason: carrierdelay
  WeatherDelayReason: weatherdelay
  NASDelayReason: nasdelay
  SecurityDelayReason: securitydelay
  LateAircraftDelayReason: lateaircraftdelay

# Logistics
logistics:
  route:
    class: Route
    key_columns: [origin, dest]
    distance_column: distance
  hub_airport:
    class: HubAirport
    # Derived: airports in top N by departures in reference year
    metric: "COUNT(*) departures WHERE origin = airport.iata"
    default_top_n: 20
    default_reference_year: 2008

# Example ontology-first analytics (agent playbook)
analytics_templates:
  on_time_performance:
    question: "OTP by carrier in peak hours"
    classes: [OTP, OnTimePerformance, OnTimeFlight, Flight, Airline, EveningPeak]
    join: operatedBy
    group_by: [airlines.code, airlines.description]
    kpi: "otp.sql.expr → otp_pct (percentage)"
    note: "Use get_business_rules otp section; never invent a different on-time threshold"
  delay_attribution:
    question: "Which delay reason dominates for a carrier?"
    classes: [DelayReason, DelayedFlight, Airline]
    kpi: "SUM per delay_reason_columns / SUM(arrdelay)"
  peak_hour_volume:
    question: "Busiest business hour band by departure count"
    classes: [TimeWindow, Flight]
    group_by: scheduledInWindow
