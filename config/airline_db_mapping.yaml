# Airline Data Ontology — DB table/column mapping
# Ontology: https://w3id.org/airline/ontology#
#
# Used by map_iceberg_schema_to_ontology / map_db_schema_to_ontology:
#   mapping_config_path: "config/airline_db_mapping.yaml"
#   use_kdm_defaults: false
#   import_kdm_if_missing: false

ontology_namespace: "https://w3id.org/airline/ontology#"

tables:
  flight: Flight
  flights: Flight
  aircraft: Aircraft
  airplane: Aircraft
  airport: Airport
  airports: Airport
  airline: Airline
  airlines: Airline
  delaybreakdown: DelayBreakdown
  delay_breakdown: DelayBreakdown
  delaybreakdowns: DelayBreakdown

columns:
  _global:
    flightnumber: flightNumber
    flight_number: flightNumber
    registration: registration
    aircrafttype: aircraftType
    aircraft_type: aircraftType
    iata_code: iataCode
    icao_code: icaoCode
    name: name
    city: city
    country_code: countryCode
    scheduled_departure: scheduledDeparture
    scheduled_arrival: scheduledArrival
    status: status
    cause_code: causeCode
    cause_description: causeDescription
    delay_minutes: delayMinutes

  flight:
    flight_number: flightNumber
    status: status

  aircraft:
    registration: registration
    aircraft_type: aircraftType

  airport:
    iata_code: iataCode
    city: city

  airline:
    iata_code: iataCode
    icao_code: icaoCode

  delay_breakdown:
    cause_code: causeCode
    delay_minutes: delayMinutes

foreign_keys:
  - source_table: flight
    target_table: airline
    edge_type: operatedBy
  - source_table: flight
    target_table: airport
    edge_type: originAirport
  - source_table: flight
    target_table: aircraft
    edge_type: assignedAircraft
  - source_table: delay_breakdown
    target_table: flight
    edge_type: hasDelayBreakdown
  - source_table: aircraft
    target_table: airline
    edge_type: operatedBy
